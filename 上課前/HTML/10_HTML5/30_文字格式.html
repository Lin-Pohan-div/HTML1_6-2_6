<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <p><a href="http://www.w3schools.com/tags/">HTML Element Reference</a></p>
    <p><a href="https://www.w3schools.com/html/html_entities.asp">HTML Entities</a></p>
    <p><a href="https://www.w3schools.com/cssref/css_default_values.asp">CSS Default Values Reference</a></p>
    <hr>
    
    <!-- 10. 可以放純文字 -->
    <div>10. 可以放純文字</div>
    1.蘋果
    香蕉<br>
    <hr>
    2.橘子 葡萄

    <!-- 20. HTML Entity -->
    <div>20. HTML Entity</div>
    <br>3.橘子&nbsp;&#160;葡萄
    <br>&lt;h1&gt;
    <br><br>
    <hr>
    <!-- 30. 文字格式 -->
    <div>30. 文字格式</div>
    
    <!-- 試試看 <b> tag -->
    <!-- b:bold 粗體 -->
    <b>b-tag_apple</b>
    
    <!-- 試試看 <i> tag -->
    <i>i-tag_apple</i>
    
    <!-- 試試看 <s> tag -->
    <s>s-tag_apple</s>
    
    <!-- 試試看 <u> tag -->
    <u>u-tag_apple</u>
    

    <br>
    
    <!-- 試試看 <strong> tag -->
    <!-- strong: 強列、非常-->
    <strong>strong-tag_apple</strong>
    
    <!-- 試試看 <em> tag -->
    <em>em-tag_apple</em>
    
    <!-- 試試看 <del> tag -->
    <del>del-tag_apple</del>
    
    <!-- 試試看 <ins> tag -->
    <ins>ins-tag_apple</ins>
    
    <!--*<b>和<strong>的差別:
        <b>:物理標記，主要使瀏覽器採用指定樣式
        <strong>:邏輯標記，主要強調文件邏輯
        其餘<i>/<em>、<s>/<del>、<u>/<ins>相同
        -->
</body>

</html>

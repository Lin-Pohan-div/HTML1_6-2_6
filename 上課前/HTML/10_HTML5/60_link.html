<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- <a>元素 -->

    <!-- 10. 外部網址連結 -->
    <a href="https://www.google.com/">google首頁</a>
    
    <br>
    <br>
    <hr>
    <!-- 試試看，target="_blank" -->
    <a href="https://www.google.com/" 
    target="_blank">google首頁(新分頁)</a>

    <br>
    <br>
    <hr>
    <!-- 20. 內部網頁檔案. 
             ex: 50_list.html、img/kitty.jpg -->
    <!-- 使用相對路徑的寫法 -->
    <!-- <a href="50_list.html">內部網頁檔案</a>     -->
    <!-- 使用相對路徑的寫法(./) -->
    <a href="./50_list.html">內部網頁檔案</a>
    <br>
    <br>
    <a href="img/kitty.jpg">內部網頁檔案</a>
    <br>
    <!-- <a href="./img/kitty.jpg">內部網頁檔案</a> -->
    <br>
    <br>
    <hr>    
    <!-- 30. 連結至網頁內元素 (#id) -->
    <!-- (#id)是放在標籤的屬性中 -->
    <a href="#第X章">跳到章節標題</a>

    <br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br>
    
    <h3 id="第X章">章節標題</h3>
    <!-- 回到網頁頂端 -->
    <a href="#">回到網頁頂端</a>
    

</body>

</html>

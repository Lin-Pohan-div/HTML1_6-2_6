<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- 試試看 <h1> ~ <h6> tag -->
    <div>1.試試看 h1 ~ h6 tag</div>
    <hr>
    <h1>標題</h1> <!---->
    <h2>標題</h2>
    <h3>標題</h3>
    <h4>標題</h4>
    <h5>標題</h5>
    <h6>標題</h6>
    <hr>
    <!-- 試試看 <p> tag -->
    <!-- paragraph，段落 -->
    <div>2.試試看 p tag</div>
    <p>地址：408台中市南屯區公益路二段51號18樓</p>
    <p>電話：(04) 2326-5860</p>
    
    <!-- 地址：408台中市南屯區公益路二段51號18樓
    電話：(04) 2326-5860 -->


    <!-- 試試看 <hr> tag -->
    <!-- horizontal rule，分隔網頁內容 -->
    <hr>

    <!-- 試試看 <br> tag -->
    <!-- break，斷行 -->
    <!-- 一般按 Enter 不會換行 -->
    <br>

    <!-- 試試看 <pre> tag -->
    <!-- preformatted，在 <pre> 內的文字，格式會被保留下來 -->
    <div>3.試試看 pre tag</div>
        <pre>
        地址：408台中市南屯區公益路二段51號18樓
        電話：(04) 2326-5860    test
    </pre>
    <hr>
    <!-- 試試看 <div> tag，division -->
    <!-- 常用來排版 -->
    <div>4.試試看 div tag</div>
        <div>            
            <div>    
                <a href="https://www.google.com">google</a>
            </div>
        </div>
        
    <!-- 區塊元素/層級(block level): 會在元素的前後換行 。-->
    
    cat-1<!--會自己佔滿整行-->
    <div>香蕉</div>
    dog_1<!--會自己佔滿整行-->
    <!--*除了div之外，當在一標籤前後新增字符時，只要在不同行即為區塊元素
        ex:div、h1~h6、p、pre    
    -->
    
    <!-- 行內元素/層級(inline level): 不會在元素的前後換行 -->
    cat-1
    <b>香蕉</b>
    dog_1
    <!--*除了b之外，當在一標籤前後新增字符時，仍在同行即為行內元素
        ex:b、    
    -->
    
    <!-- 區塊元素可以包含區塊元素 -->
    <div>
        <h1></h1>
        <p></p>
    </div>
    <!--無法在段落中存放容器-->
    <!-- <p><div></div></p> -->

    <!-- 區塊元素可以包含行內元素 -->
    <p>
        <b></b>
        <i></i>
    </p>
    
    <!-- 試試看 <span> tag -->
    <!-- 三原色有，紅、綠、藍三種顏色 -->
    
    <div>第一種做法</div>
    三原色有，
    <span style="color: red">紅</span>、
    <span style="color: green">綠</span>、
    <span style="color: blue">藍</span>三種顏色  
    <hr>
    <div>第二種做法</div>
    三原色有，<red>紅</red>、<green>綠</green>、<blue>藍</blue>三種顏色
    
    <p id="red">
        <style>
            red{color:red}
        </style>
    </p>
    <p id="green">
        <style>
            green{color:green}
        </style>
    </p>
    <p id="blue">
        <style>
            blue{color:blue}
        </style>
    </p>
    <hr>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- 註解/取消註解: Ctrl + / -->
    <!-- 存檔: Ctrl + S -->

    <!-- 10. 開始標籤到結束標籤 -> 元素 -->
    <h1>這是一個標題</h1>
    <h2>這是一個副標題</h2>

    <!-- 20. 元素的屬性 -->

    <!-- id 屬性值:
        1. 可以自訂，但需遵守命名規則
        2. 必須唯一，在同一個 HTML 文件中不能重複
        3. 有區分大小寫，ex: "Content" 與 "content" 不同
        4. 至少包含一個字元，不能為空
        5. 不能以數字開頭， ex: "1content" 不合法
        6. 不能包含空格  ex: "my content" 不合法   -->
    <h1 id="content">Hello,World!</h1>

    <!-- 21. 不同元素可能有不同屬性。 ex: <a> -->
    <!-- href: hypertext reference -->
    <a href="https://www.google.com">google</a>

    <!-- 22. 元素可以有多個屬性。 ex: <a> -->
    <!-- 複製程式碼:shift + alt + ↑ / ↓ -->
    <!-- 搬移程式碼:alt + ↑ / ↓ -->
    <!-- 整理文件格式:shift + alt + f -->
    <a id="google" href="https://www.google.com">google</a>

    <!-- 試試看，
         元素使用不支援的屬性，是否能達到效果?(x)  -->
    <!-- 實驗:在h1元素中加入href屬性 -->
    <h1 href="https://www.google.com">google1</h1>
    <h1><a href="https://www.google.com">google1</a></h1>

</body>

</html>

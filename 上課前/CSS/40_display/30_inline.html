<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h3> display: block 區塊 </h3>
    <div class="demo">
        <div id="reddiv_A">Red</div>
        <div id="greendiv_A">Green</div>
        <div id="bluediv_A">Blue</div>
    </div>

    <hr>

    <h3>
        行內元素的 display 屬性值預設為 inline <br>
        display: inline 直譯：一行
    </h3>
    <!-- 試試看，在 Red、Green、Blue 的 div 裡面加上 style="display: inline;" -->
    <!-- 
        行內元素的預設值稱為inline，通常該元素高度和寬度是由內容決定的，
        無法使用width、height決定寬高 
    -->
    <div class="demo">
        <div id="reddiv_B" style="display: inline;">Red</div>
        <div id="greendiv_B" style="display: inline;">Green</div>
        <div id="bluediv_B" style="display: inline;">Blue</div>
    </div>


</body>

</html>

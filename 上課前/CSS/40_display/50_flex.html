<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h3> display: block 區塊 </h3>
    <div class="demo">
        <div id="reddiv_A">Red</div>
        <div id="greendiv_A">Green</div>
        <div id="bluediv_A">Blue</div>
    </div>

    <hr>

    <!-- 10. 試試看，在 .demo 加上 display: flex  -->
    <!-- 20. 試試看，在 #reddiv_B、#greendiv_B、#bluediv_B 加上 flex: 自訂的數值 -->

    <h3> display: flex </h3>
    <div class="demo" style="display: flex;">
        <!-- 子元素所使用的flex屬性需搭配父元素一起使用 -->
        <div style="flex: 3;" id="reddiv_B">Red (flex: 3)</div>
        <div style="flex: 2;" id="greendiv_B">Green (flex: 2)</div>
        <div style="flex: 1;" id="bluediv_B">Blue (flex: 1)</div>
        <!-- flex:3|flex: 2|flex: 1是將父元素的空間進行等分(分6份)-->
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>html blockquote tag example</title>
</head>
<body>
    <!--
    <blockquote> 標籤用於表示引用的內容，通常用來標記從其他來源引用的文字或段落。
    此標籤在語義上表示所包含的內容是來自外部來源的引文，瀏覽器通常會對其進行縮進顯示。
    -->
    <blockquote>
        Freedom is not worth having if it does not connote freedom to err. 
        It passes my comprehension how human beings, be they ever so experienced and able, 
        can delight in depriving other human beings of that precious right.
    </blockquote>
    <!-- 
    主要特點：
    - 語義化標籤，表示引用內容
    - 預設樣式通常包含左右邊距縮進
    - 可搭配 cite 屬性指定引用來源的 URL
    - 可與 <cite> 標籤配合使用來標注引用來源
    - 支援巢狀使用來表示多層引用

    常見用法：
    - 引用文章段落
    - 顯示用戶評論或推薦
    - 標記重要聲明或格言
    - 法律或學術文件中的引文
    -->
</body>
</html>

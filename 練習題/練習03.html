<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習03</title>
    <style>
        input[type="checkbox"]:checked+label {
            /* 如果 checked 沒有指定元素類型（如 input:checked），選擇器可能無效或行為未定義，這是初學者常遇到的陷阱。 */
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <!-- 參照 練習03.png，製作待辦清單。完成待辦事項時，文字要加入刪除線。 -->
    <form action="">
        <input type="checkbox" name="que" id="ch1">
        <label for="ch1">訂車票</label>
        <br>
        <input type="checkbox" name="que" id="ch2">
        <label for="ch2">買辦手禮</label>

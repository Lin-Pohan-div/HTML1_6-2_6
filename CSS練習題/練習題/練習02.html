<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習02</title>
    <!--  2. 滑鼠經過選項文字時，文字底色改為黃色 -->
    <style>
        .radio:hover {
            background-color: yellow;
        }
        /* 3. 點選單選框後，選項文字改成藍色 */
        input[type="radio"]:checked+label{
            /* 如果 checked 沒有指定元素類型（如 input:checked），選擇器可能無效或行為未定義，這是初學者常遇到的陷阱。 */
            color: blue;
        }


    </style>
</head>

<body>

    <!-- 參照 練習02.png，完成以下需求:
         1. 在表單中加入三個單選框及選項文字
         2. 滑鼠經過選項文字時，文字底色改為黃色
         3. 點選單選框後，選項文字改成藍色 -->

    <!-- 虛擬類別的參考文件: -->
    <!-- https://www.w3schools.com/cssref/css_ref_pseudo_classes.php -->

    <!--  1. 在表單中加入三個單選框及選項文字 -->
    <form action="">
        <input type="radio" name="que" id="ch1">
        <label for="ch1">選項1</label>

        <input type="radio" name="que" id="ch2">
        <label for="ch2">選項2</label>

        <input type="radio" name="que" id="ch3">
        <label for="ch3">選項3</label>
    </form>


</html>

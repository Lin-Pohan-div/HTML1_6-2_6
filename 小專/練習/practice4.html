<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON practice</title>
    <link rel="stylesheet" href="../webpage.css">
</head>

<body>

    <h1>使用者資訊</h1>
    <p>class：<span id="user-class"></span></p>
    <p>style：<span id="user-style"></span></p>    
    <p>text:<span id="user-text"></span></p>




    <script>
        fetch('data.json') // 請求 JSON 文件
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json(); // 將回應轉換為 JSON 物件
            })
            .then(data => {
                // 成功取得資料後，開始處理
                if (!data || typeof data !== 'object') throw new Error('Invalid JSON data');
                console.log(data);
                // 安全地將 data 渲染到 HTML（使用 nullish 合併與檢查）
                document.getElementById('user-class').textContent = data['class'] ?? '';
                document.getElementById('user-style').textContent = data.style ?? '';
                document.getElementById('user-text').textContent = data.text ?? '';
            })
            .catch(error => {
                console.error('讀取 JSON 時發生錯誤:', error); // 處理錯誤
                const errEl = document.createElement('p');
                errEl.textContent = '讀取 JSON 時發生錯誤: ' + (error && error.message ? error.message : error);
                document.body.appendChild(errEl);
            });

    </script>


</body>

</html>

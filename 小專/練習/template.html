<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="js_template.css">
</head>

<body style="background-color: antiquewhite;">

    <template id="card-template">
        <article class="card" role="article">
            <img class="card-img-top" src="" alt="" style="width:100%;height:auto;border-radius:14px;">
            <div class="card-body">
                <h5 class="card-title"></h5>
                <p class="card-text"></p>
                <a class="btn btn-primary" href="#">Go somewhere</a>
            </div>
        </article>
    </template> 

    <div id="cards-container" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;"></div>

        <script>
            (function () {
                const data = [
                    { img: 'https://picsum.photos/seed/1/300/180', title: 'Coastal Escape', text: 'Sun, sand and sea.', href: '#dest1' },
                    { img: 'https://picsum.photos/seed/2/300/180', title: 'Mountain Hike', text: 'Trails and scenic views.', href: '#dest2' },
                    { img: 'https://picsum.photos/seed/3/300/180', title: 'City Break', text: 'Explore urban life and cuisine.', href: '#dest3' }
                ];

                const tpl = document.getElementById('card-template');
                const container = document.getElementById('cards-container');

                data.forEach(item => {
                    const clone = tpl.content.cloneNode(true);
                    const img = clone.querySelector('.card-img-top');
                    const title = clone.querySelector('.card-title');
                    const text = clone.querySelector('.card-text');
                    const link = clone.querySelector('a');

                    img.src = item.img;
                    img.alt = item.title;
                    title.textContent = item.title;
                    text.textContent = item.text;
                    link.href = item.href;

                    container.appendChild(clone);
                });
            })();
        </script>
</body>
</html>

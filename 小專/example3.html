<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技新視界 TechView</title>
    <style>
        /* --- 基礎設定 (Reset & Variables) --- */
        :root {
            --primary-blue: #9ecbf5; /* 對應圖片中的淺藍色 */
            --dark-blue: #4a90e2;    /* 深一點的藍色用於圖示/按鈕 */
            --gray-bg: #e0e0e0;      /* 圖片佔位符灰色 */
            --text-color: #333;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: var(--text-color);
            padding: 20px;
        }

        /* --- 頂部導覽列 (Header) --- */
        /* 對應圖片最上方的 Menu icon 與 Search bar */
        header {
            display: flex;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-blue);
            background: #fff;
            padding: 15px;
        }

        .menu-icon {
            font-size: 24px;
            margin-right: 20px;
            cursor: pointer;
        }

        .search-bar {
            flex-grow: 1;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #ccc;
            outline: none;
        }

        .search-bar::after {
            content: '🔍';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        /* --- 主要標題區塊 (Hero Section) --- */
        /* 對應圖片中間大的藍色 Title 區塊 */
        .hero-section {
            background-color: var(--primary-blue);
            padding: 40px 20px;
            text-align: center;
            border-radius: 15px; /* 切角造型 */
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .hero-section h1 {
            color: #fff;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* --- 新聞列表佈局 (Grid Layout) --- */
        /* 對應圖片左上角：左邊文字條列，右邊圖片塊的佈局 */
        .content-group {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px;
            border: 1px solid #eee;
        }

        /* 左側文字列表 */
        .text-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .text-item {
            background-color: var(--primary-blue);
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px; /* 輕微圓角 */
            cursor: pointer;
            transition: opacity 0.3s;
            text-decoration: none;
            display: block;
        }

        .text-item:hover {
            opacity: 0.8;
        }

        /* 右側圖片區域 */
        .image-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 兩欄圖片 */
            gap: 15px;
        }

        .img-placeholder {
            background-color: var(--gray-bg);
            height: 100px;
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .img-placeholder span {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .img-line {
             width: 40px;
             height: 4px;
             background-color: #bbb;
             border-radius: 2px;
        }

        /* --- 橫向捲動區塊 (Slider Section) --- */
        /* 對應圖片左下角的「滾輪」區塊 */
        .slider-section {
            margin-top: 50px;
            border-top: 2px solid #333;
            padding-top: 20px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        /* 模擬圖片中的 "滾輪" 樣式 */
        .scrollbar-mock {
            width: 200px;
            height: 10px;
            border: 2px solid #333;
            border-radius: 10px;
            position: relative;
            margin: 0 auto;
        }
        
        .scrollbar-thumb {
            width: 50px;
            height: 6px;
            background: #333;
            border-radius: 10px;
            position: absolute;
            top: 0;
            left: 20px; /* 模擬位置 */
        }

        .card-container {
            display: flex;
            overflow-x: auto; /* 啟用橫向捲動 */
            gap: 20px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        
        /* 隱藏預設捲軸美觀用 */
        .card-container::-webkit-scrollbar {
            height: 8px;
        }
        .card-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .card {
            min-width: 150px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-img {
            width: 100%;
            height: 120px;
            background-color: var(--gray-bg);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-text {
            background-color: var(--primary-blue);
            color: #fff;
            padding: 8px;
            font-size: 12px;
            text-align: center;
            border-radius: 4px;
        }

        /* 導航按鈕 (箭頭) */
        .nav-arrows {
            display: flex;
            justify-content: space-between;
            position: absolute;
            width: 100%;
            left: 0;
            pointer-events: none; /* 讓點擊穿透到內容 */
        }
        
        .arrow-btn {
            pointer-events: auto;
            background: none;
            border: none;
            font-size: 40px;
            color: #555;
            cursor: pointer;
        }

        /* 手機版調整 */
        @media (max-width: 600px) {
            .content-group {
                flex-direction: column;
            }
            .image-grid {
                grid-template-columns: 1fr 1fr; /* 手機上保持並排或改成 1fr 堆疊 */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon">≡</div>
        <div class="search-bar">
            <input type="text" placeholder="搜尋科技新聞...">
        </div>
    </header>

    <section class="hero-section">
        <h1>本週科技焦點</h1>
    </section>

    <section class="content-group">
        <div class="text-list">
            <a href="#" class="text-item">2025 AI 產業趨勢報告發布</a>
            <a href="#" class="text-item">新款處理器效能實測數據曝光</a>
            <a href="#" class="text-item">電動車電池技術重大突破</a>
        </div>
        <div class="image-grid">
            <div class="img-placeholder">
                <span>🖼️</span>
                <div class="img-line"></div>
            </div>
            <div class="img-placeholder">
                <span>🖼️</span>
                <div class="img-line"></div>
            </div>
        </div>
    </section>

    <section class="content-group">
        <div class="text-list">
            <a href="#" class="text-item">太空探索：火星任務新進度</a>
            <a href="#" class="text-item">量子電腦運算速度再創新高</a>
            <a href="#" class="text-item">資訊安全：企業如何防禦網攻</a>
        </div>
        <div class="image-grid">
            <div class="img-placeholder">
                <span>🖼️</span>
                <div class="img-line"></div>
            </div>
            <div class="img-placeholder">
                <span>🖼️</span>
                <div class="img-line"></div>
            </div>
        </div>
    </section>

    <section class="slider-section" style="position: relative;">
        <div class="slider-header">
            <div style="background: blue; color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px;">&lt;</div>
            
            <div class="scrollbar-mock">
                <div class="scrollbar-thumb"></div>
            </div>
            
            <div></div> </div>

        <div class="card-container">
            <div class="nav-arrows" style="top: 50%;">
                <button class="arrow-btn" style="margin-left: -10px;">&lt;</button>
                <button class="arrow-btn" style="margin-left: auto; margin-right: -10px;">&gt;</button>
            </div>

            <div class="card">
                <div class="card-img"><span>🖼️</span></div>
                <div class="card-text">智慧居家評測</div>
                <div class="card-text">最新上市</div>
            </div>
            <div class="card">
                <div class="card-img"><span>🖼️</span></div>
                <div class="card-text">程式語言入門</div>
                <div class="card-text">Python 教學</div>
            </div>
            <div class="card">
                <div class="card-img"><span>🖼️</span></div>
                <div class="card-text">區塊鏈應用</div>
                <div class="card-text">金融科技</div>
            </div>
            <div class="card">
                <div class="card-img"><span>🖼️</span></div>
                <div class="card-text">VR 虛擬實境</div>
                <div class="card-text">遊戲體驗</div>
            </div>
             <div class="card">
                <div class="card-img"><span>🖼️</span></div>
                <div class="card-text">5G 網路建設</div>
                <div class="card-text">基礎設施</div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
             <button style="padding: 5px 15px; border-radius: 15px; border: 1px solid #ccc; background: #eee;">更多內容</button>
             <div style="background: blue; color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px;">🏠</div>
        </div>
    </section>

</body>
</html>
